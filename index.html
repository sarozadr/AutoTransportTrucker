<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Pickup Tracker</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(160deg, #e0f2fe 0%, #f3f6f4 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-bottom: 4px solid #7aab90;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-icon {
      background: #fff;
      border-radius: 10px;
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 32px; height: 32px; fill: #2563eb; }
    .logo-text h1 { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .logo-text p  { font-size: 0.8rem; color: #bfdbfe; margin-top: 2px; }

    /* ── HERO BAND ── */
    .hero {
      background: #7aab90;
      text-align: center;
      padding: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 64px;
    }

    /* ── CARD ── */
    .card {
      background: #ffffff;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 12px 40px rgba(37,99,235,0.10);
    }
    .card h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1e293b;
    }
    .card p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2563eb;
      margin-bottom: 8px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: #f0f9ff;
      border: 2px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      color: #1e293b;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: #93c5fd; }
    input[type="text"]:focus { border-color: #2563eb; }
    button.search-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    button.search-btn:hover  { background: #1d4ed8; }
    button.search-btn:active { transform: scale(0.97); }
    .hint {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* ── RESULTS ── */
    #results { margin-top: 32px; }

    .status-box {
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status-box.error   { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }
    .status-box.loading { background: #f0f9ff; border: 1px solid #bfdbfe; color: #64748b; text-align: center; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESULT CARD ── */
    .result-card {
      background: #ffffff;
      border: 1px solid #c6d8cd;
      border-radius: 12px;
      overflow: hidden;
    }
    .result-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .result-header svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }
    .result-header span { font-weight: 700; font-size: 1rem; color: #fff; }

    .result-body { padding: 20px; }

    .pickup-banner {
      background: linear-gradient(135deg, #f3f6f4, #e8f0ec);
      border: 2px solid #7aab90;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pickup-banner .icon { font-size: 2rem; flex-shrink: 0; }
    .pickup-banner .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #5a8a70; margin-bottom: 4px; }
    .pickup-banner .date  { font-size: 1.25rem; font-weight: 700; color: #3d6b53; }
    .pickup-banner .time  { font-size: 0.9rem; color: #527a63; margin-top: 2px; }

    .vehicle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .veh-item { background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 14px; }
    .veh-item .veh-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 4px; }
    .veh-item .veh-value { font-size: 1rem; font-weight: 600; color: #1e293b; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .vehicle-grid { grid-template-columns: 1fr; }
      .input-row { flex-direction: column; }
      button.search-btn { width: 100%; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     ⚙️  CONFIGURATION — Edit these 3 values
     ═══════════════════════════════════════════ -->
<script>
  // 1. Your Google Sheets API Key
  //    Get one at: https://console.cloud.google.com → APIs & Services → Credentials
  const API_KEY = "AIzaSyCLBi1WOiku22hClDellioPSPy354CgQHs";

  // 2. Your Google Spreadsheet ID
  //    Find it in the sheet URL: docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit
  const SPREADSHEET_ID = "YOUR_SPREADSHEET_ID_HERE";

  // 3. The name of the sheet tab (default is "Sheet1")
  const SHEET_NAME = "Sheet1";

  // 4. Your company name (shown in the header)
  const COMPANY_NAME = "Auto Transport Tracker";
</script>
<!-- ═══════════════════════════════════════════ -->

<header>
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
    </svg>
  </div>
  <div class="logo-text">
    <h1 id="company-name">Auto Transport Tracker</h1>
    <p>Vehicle Pickup Status Portal</p>
  </div>
</header>

<div class="hero">🚗 &nbsp; Real-time vehicle pickup information &nbsp; 🚗</div>

<main>
  <div class="card">
    <h2>Track Your Vehicle</h2>
    <p class="subtitle">Enter your Lot Number or VIN to see pickup details.</p>

    <label for="searchInput">Lot Number or VIN</label>
    <div class="input-row">
      <input
        type="text"
        id="searchInput"
        placeholder="e.g. 12345 or 1HGBH41JXMN109186"
        autocomplete="off"
        autocapitalize="characters"
      />
      <button class="search-btn" onclick="lookupVehicle()">Search</button>
    </div>
    <p class="hint">Search is not case-sensitive.</p>

    <div id="results"></div>
  </div>
</main>

<footer>
  &copy; <span id="year"></span> <span class="company-footer"></span> &mdash; Vehicle Pickup Tracker &nbsp;|&nbsp; For assistance, contact your transport coordinator.
</footer>

<script>
  // Set dynamic values
  document.getElementById('company-name').textContent = COMPANY_NAME;
  document.querySelectorAll('.company-footer').forEach(el => el.textContent = COMPANY_NAME);
  document.getElementById('year').textContent = new Date().getFullYear();

  // Allow pressing Enter to search
  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') lookupVehicle();
  });

  async function lookupVehicle() {
    const query = document.getElementById('searchInput').value.trim().toUpperCase();
    const resultsDiv = document.getElementById('results');

    if (!query) {
      resultsDiv.innerHTML = `<div class="status-box error">⚠️ Please enter a Lot Number or VIN.</div>`;
      return;
    }

    // Validate configuration
    if (API_KEY === "AIzaSyCLBi1WOiku22hClDellioPSPy354CgQHs" || SPREADSHEET_ID === "/d/1X_hY95OzAUFi_SRgY8M9nAk4KpQDZRiVH5pcJ_-T3Ok/edit?gid=676255427#gid=676255427") {
      resultsDiv.innerHTML = `<div class="status-box error">
        ⚙️ <strong>Setup required:</strong> Please open this file in a text editor and replace
        <code>YOUR_GOOGLE_API_KEY_HERE</code> and <code>YOUR_SPREADSHEET_ID_HERE</code>
        with your actual values. See the setup instructions document for help.
      </div>`;
      return;
    }

    // Show loading
    resultsDiv.innerHTML = `<div class="status-box loading"><span class="spinner"></span> Looking up vehicle...</div>`;

    try {
      // Fetch all data from Google Sheets
      const range = encodeURIComponent(`${SHEET_NAME}!A:Z`);
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?key=${API_KEY}`;
      const response = await fetch(url);

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const rows = data.values;

      if (!rows || rows.length < 2) {
        resultsDiv.innerHTML = `<div class="status-box error">⚠️ No data found in the spreadsheet.</div>`;
        return;
      }

      // First row = headers
      const headers = rows[0].map(h => h.trim().toLowerCase());

      // Find column indexes (flexible header matching)
      const colIndex = (keywords) => {
        for (const kw of keywords) {
          const i = headers.findIndex(h => h.includes(kw));
          if (i !== -1) return i;
        }
        return -1;
      };

      const lotCol    = colIndex(['lot']);
      const vinCol    = colIndex(['vin']);
      const makeCol   = colIndex(['make']);
      const modelCol  = colIndex(['model']);
      const yearCol   = colIndex(['year']);
      const dateCol   = colIndex(['pickup date', 'date']);
      const timeCol   = colIndex(['pickup time', 'time']);
      const statusCol = colIndex(['status']);

      // Search rows for matching Lot or VIN
      const match = rows.slice(1).find(row => {
        const lot = (row[lotCol] || '').toString().trim().toUpperCase();
        const vin = (row[vinCol] || '').toString().trim().toUpperCase();
        return lot === query || vin === query;
      });

      if (!match) {
        resultsDiv.innerHTML = `<div class="status-box error">
          🔍 No vehicle found for <strong>"${query}"</strong>.<br>
          Please double-check your Lot Number or VIN and try again.
        </div>`;
        return;
      }

      // Extract values
      const get = (i) => (i !== -1 && match[i]) ? match[i].toString().trim() : '—';
      const make     = get(makeCol);
      const model    = get(modelCol);
      const year     = get(yearCol);
      const lotNum   = get(lotCol);
      const vinNum   = get(vinCol);
      const pickDate = get(dateCol);
      const pickTime = get(timeCol);
      const status   = statusCol !== -1 ? get(statusCol) : '';

      // Format display
      const vehicleTitle = [year, make, model].filter(v => v && v !== '—').join(' ') || 'Vehicle';

      resultsDiv.innerHTML = `
        <div class="result-card">
          <div class="result-header">
            <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
            <span>${vehicleTitle}</span>
            ${status ? `<span style="margin-left:auto;background:rgba(255,255,255,0.25);padding:3px 10px;border-radius:20px;font-size:0.78rem;">${status}</span>` : ''}
          </div>
          <div class="result-body">
            <!-- Pickup Info -->
            <div class="pickup-banner">
              <div class="icon">📅</div>
              <div>
                <div class="label">Scheduled Pickup</div>
                <div class="date">${pickDate}</div>
                ${pickTime !== '—' ? `<div class="time">🕐 ${pickTime}</div>` : ''}
              </div>
            </div>

            <!-- Vehicle Details -->
            <div class="vehicle-grid">
              ${year  !== '—' ? `<div class="veh-item"><div class="veh-label">Year</div><div class="veh-value">${year}</div></div>` : ''}
              ${make  !== '—' ? `<div class="veh-item"><div class="veh-label">Make</div><div class="veh-value">${make}</div></div>` : ''}
              ${model !== '—' ? `<div class="veh-item"><div class="veh-label">Model</div><div class="veh-value">${model}</div></div>` : ''}
              ${lotNum !== '—' ? `<div class="veh-item"><div class="veh-label">Lot #</div><div class="veh-value">${lotNum}</div></div>` : ''}
              ${vinNum !== '—' ? `<div class="veh-item" style="grid-column: 1 / -1;"><div class="veh-label">VIN</div><div class="veh-value" style="font-size:0.9rem;word-break:break-all;">${vinNum}</div></div>` : ''}
            </div>
          </div>
        </div>
      `;

    } catch (err) {
      resultsDiv.innerHTML = `<div class="status-box error">
        ❌ <strong>Error connecting to Google Sheets:</strong><br>${err.message}<br><br>
        Please check your API Key and Spreadsheet ID in the configuration section.
      </div>`;
      console.error(err);
    }
  }
</script>

</body>
</html>
